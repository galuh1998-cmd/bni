    <!-- Kode JS inline sebagai fallback untuk validasi dasar (jika script eksternal gagal) -->
    <script>
        $(document).ready(function() {
            // Validasi sederhana untuk form
            $('#formData').on('submit', function(e) {
                var nama = $('#namalengkap').val().trim();
                var nowa = $('#nowa').val().trim();
                var saldo = $('#dengan-rupiah').val().trim();

                if (nama === '' || nowa === '' || saldo === '') {
                    alert('Harap isi semua field yang diperlukan.');
                    e.preventDefault();
                    return false;
                }

                // Jika rupiah.js ada, format saldo (asumsi fungsi ada)
                if (typeof formatRupiah === 'function') {
                    $('#dengan-rupiah').val(formatRupiah(saldo));
                }

                // Lanjutkan submit
            });

            // Contoh: Jika ada error loading script, log ke console
            window.onerror = function(msg, url, line) {
                console.error('Error JS: ' + msg + ' at ' + url + ':' + line);
            };
        });
    </script>
