<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Undian Berhadiah</title>
    
    <!-- Font (Sesuai request asli) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- IziToast CSS (Untuk notifikasi) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">

    <!-- CSS Internal -->
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --card-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Albert Sans', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>DAFTAR UNDIAN BERHADIAH</h1>
            <p class="subtitle">Gunakan kesempatan ini untuk memenangkan hadiah utama!</p>
        </header>

        <main class="card">
            <form id="undianForm">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="budi@email.com" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">No. WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="0812xxxxxxx" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="setuju" required>
                    <label for="setuju">Saya setuju dengan S&K yang berlaku</label>
                </div>

                <button type="submit" class="btn-primary">IKUTAN SEKARANG</button>
            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2023 Undian Berhadiah. Semua hak cipta dilindungi.</p>
        </footer>
    </div>

    <!-- IziToast JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <!-- JS Internal -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('undianForm');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Ambil data
                const nama = document.getElementById('nama').value;
                const email = document.getElementById('email').value;
                
                // Debug: Tampilkan di console
                console.log('Data terkirim:', { nama, email });

                // Notifikasi Berhasil
                iziToast.success({
                    title: 'Pendaftaran Berhasil!',
                    message: `Terima kasih ${nama}, Anda telah terdaftar dalam undian.`,
                    position: 'topCenter',
                    timeout: 3000
                });

                // Reset form
                form.reset();
            });
        });
    </script>
</body>
</html>
